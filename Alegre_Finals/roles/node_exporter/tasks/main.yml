---
- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create node_exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0755'
  loop:
    - /opt/node_exporter

- name: Map architecture for downloads
  ansible.builtin.set_fact:
    node_exporter_arch: >-
      {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else
         'arm64' if ansible_architecture in ['aarch64', 'arm64'] else
         ansible_architecture }}

- name: Download node_exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring.node_exporter.version }}/node_exporter-{{ monitoring.node_exporter.version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ monitoring.node_exporter.version }}.tar.gz"
    mode: '0644'

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ monitoring.node_exporter.version }}.tar.gz"
    dest: /opt/node_exporter
    remote_src: true
    extra_opts:
      - "--strip-components=1"
  notify: Restart node_exporter

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: /opt/node_exporter/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  notify: Restart node_exporter

- name: Create systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ monitoring.node_exporter.port | default(9100) }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart node_exporter

- name: Ensure node_exporter is enabled and running
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
